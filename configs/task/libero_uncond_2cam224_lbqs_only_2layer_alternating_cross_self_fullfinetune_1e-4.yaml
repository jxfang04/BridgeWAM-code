# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: bridgewam
  - _self_

# Extreme GR00T-style Action head experiment. Video DiT remains 30 layers;
# Action alternates one Cross-only block and one Action Self-only block.
model:
  checkpoint_attention: false
  skip_dit_load_from_pretrain: false
  latent_bridge_queries:
    enabled: true
    generation_coupling: future_video_reads_lbq
    injection_mode: lbq_only
    num_lbqs: 32
    start_layer: 0
    readout_layer: -1
    lbq_attention: bidirectional
    lbq_rope_mode: identity
    eps: 1.0e-6
    preserve_direct_video_kv: false
    freeze_video_expert: false
    train_action_cross_attention: true
    action_cross_attention_lr_scale: 1.0
    strict_training_scope: false
  action_dit_config:
    architecture: alternating_cross_self
    num_layers: 2
    add_pos_embed: true
    max_action_horizon: 1024
  loss:
    lambda_video: 1.0
    lambda_action: 1.0

batch_size: 16
num_workers: 8
lr_scheduler_type: cosine
learning_rate: 1.0e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 200
gradient_accumulation_steps: 1
weight_decay: 1.0e-2

resume: null

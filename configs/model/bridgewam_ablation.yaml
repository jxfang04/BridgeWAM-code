_target_: bridgewam.models.wan22.ablation_bridgewam.factory.create_bridgewam_ablation
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
checkpoint_attention: true

ablation:
  type: lbq_kv_mot
  release_checkpoint_path: null
  video_cond_noise_prob: 0.5

latent_bridge_queries:
  enabled: true
  generation_coupling: future_video_reads_lbq
  injection_mode: lbq_only
  num_lbqs: 32
  start_layer: 0
  readout_layer: -1
  lbq_attention: bidirectional
  lbq_rope_mode: identity
  eps: 1.0e-6
  preserve_direct_video_kv: false
  freeze_video_expert: false
  train_action_cross_attention: true
  action_cross_attention_lr_scale: 1.0
  strict_training_scope: false

action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-6
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.checkpoint_attention}
  video_attention_mask_mode: first_frame_causal
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: group_diagonal

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 2
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-6
  use_gradient_checkpointing: ${model.checkpoint_attention}
  architecture: alternating_cross_self
  add_pos_embed: true
  max_action_horizon: 1024

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 1.0
  lambda_action: 1.0
